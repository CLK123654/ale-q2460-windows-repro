name: q2460-windows-repro

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Workflow mode
        required: true
        default: reference
        type: choice
        options:
          - reference
          - verify
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.12
      - name: Install YAML library
        shell: pwsh
        run: python -m pip install PyYAML==6.0.2
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.4
      - name: Record Windows host
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path evidence | Out-Null
          $hostInfo = [ordered]@{
            caption = (Get-CimInstance Win32_OperatingSystem).Caption
            version = (Get-CimInstance Win32_OperatingSystem).Version
            build = (Get-CimInstance Win32_OperatingSystem).BuildNumber
            runner_image = $env:ImageOS
            python_version = (python --version)
            commit_sha = $env:GITHUB_SHA
            workflow_run_id = $env:GITHUB_RUN_ID
          }
          $hostInfo | ConvertTo-Json | Set-Content -Encoding utf8NoBOM evidence/windows-host.json
      - name: Generate Reference candidate
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'reference' }}
        shell: pwsh
        run: |
          $env:HELM_PATH = (Get-Command helm).Source
          python ./qa/generate_reference.py
      - name: Verify attachment hashes
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'verify') }}
        shell: pwsh
        run: python ./qa/verify_hashes.py
      - name: Block Helm external network
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'verify') }}
        shell: pwsh
        run: |
          $helm = (Get-Command helm).Source
          New-NetFirewallRule -DisplayName q2460-helm-no-external -Direction Outbound -Program $helm -Action Block | Out-Null
          Get-NetFirewallRule -DisplayName q2460-helm-no-external | Select-Object DisplayName,Enabled,Direction,Action | ConvertTo-Json | Set-Content -Encoding utf8NoBOM evidence/network-guard.json
      - name: Verify final task on Windows
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'verify') }}
        shell: pwsh
        run: |
          $env:HELM_PATH = (Get-Command helm).Source
          python ./qa/windows_verify.py
      - name: Remove Helm network guard
        if: always()
        shell: pwsh
        run: Get-NetFirewallRule -DisplayName q2460-*-no-external -ErrorAction SilentlyContinue | Remove-NetFirewallRule
      - name: Upload independent evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q2460-windows-evidence
          path: evidence/**
          if-no-files-found: error
          retention-days: 1
